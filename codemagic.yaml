workflows:
  capacitor-ios-ipa:
    name: Capacitor iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Build unsigned iOS app
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/ios/App/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA for third-party signing
        script: |
          cd "$CM_BUILD_DIR/ios/App/build/Build/Products/Release-iphoneos"
          mkdir Payload
          cp -R App.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "App-unsigned.ipa"
    artifacts:
      - ios/App/build/Build/Products/Release-iphoneos/App-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
