  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MON AGENDA</p>
          <h1 id="month-title">Janvier <span>2026</span></h1>
        </div>
        <div><button class="reminder-button" id="reminder-button" type="button">Rappels</button><button class="today-button" id="today-button" type="button">Aujourd’hui</button></div>
      </header>

      <section class="calendar-card" aria-label="Calendrier">
        <div class="calendar-nav">
          <button class="icon-button" id="previous-month" aria-label="Mois précédent" type="button">‹</button>
          <button class="month-picker" id="month-picker" type="button" aria-label="Choisir le mois et l’année">Parcourir <span>⌄</span></button>
          <button class="icon-button" id="next-month" aria-label="Mois suivant" type="button">›</button>
        </div>
        <div class="weekdays" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span></div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </section>

      <section class="day-summary" id="day-summary" aria-live="polite">
        <div class="summary-heading">
          <div><p class="eyebrow" id="selected-label">JOUR SÉLECTIONNÉ</p><h2 id="selected-title"></h2></div>
          <button class="add-button" id="add-note" type="button" aria-label="Ajouter une note">+</button>
        </div>
        <div class="note-list" id="note-list"></div>
      </section>
    </main>

    <section class="reminder-panel" id="reminder-panel" hidden aria-label="Rappels d’examen">
      <div class="sheet-header"><strong>Rappel d’examen</strong><button class="text-button" id="close-reminder" type="button">Fermer</button></div>
      <label for="reminder-title">Examen</label><input id="reminder-title" placeholder="Ex. Examen de mathématiques" />
      <label for="reminder-date">Date de l’examen</label><input id="reminder-date" type="date" />
      <label for="reminder-time">Heure du rappel</label><input id="reminder-time" type="time" value="09:00" />
      <label for="reminder-days">Me prévenir combien de jours avant ?</label><input id="reminder-days" type="number" min="0" max="60" value="3" />
      <button class="save-button" id="save-reminder" type="button">Enregistrer le rappel</button>
      <div id="reminder-list" style="margin-top:16px"></div>
    </section>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <section class="sheet" id="note-sheet" aria-label="Modifier une note du jour" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-header"><button class="text-button" id="cancel-note" type="button">Annuler</button><strong id="sheet-title">Nouvel élément</strong><button class="save-button" id="save-note" type="button">Enregistrer</button></div>
      <div class="sheet-content">
        <p class="sheet-date" id="sheet-date"></p>
        <label class="field-label" for="note-text">QUE DEVEZ-VOUS RETENIR ?</label>
        <textarea id="note-text" maxlength="280" placeholder="Ex. Terminer la fiche de chimie…"></textarea>
        <div class="field-label">TYPE</div>
        <div class="type-selector" id="type-selector">
          <button type="button" data-type="Homework" class="type-option active"><i class="dot homework"></i>Devoir</button>
          <button type="button" data-type="Exam" class="type-option"><i class="dot exam"></i>Examen</button>
          <button type="button" data-type="Note" class="type-option"><i class="dot note"></i>Note</button>
        </div>
        <button class="delete-button" id="delete-note" type="button" hidden>Supprimer l’élément</button>
      </div>
    </section>

    <section class="picker-popover" id="picker-popover" hidden aria-label="Choisir un mois">
      <div class="picker-top"><strong>Aller à</strong><button id="close-picker" type="button" aria-label="Fermer le sélecteur de mois">×</button></div>
      <div class="year-tabs"><button data-year="2026" type="button">2026</button><button data-year="2027" type="button">2027</button></div>
      <div class="month-buttons" id="month-buttons"></div>
    </section>
    <script>
      const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'],shortMonths=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],storageKey='daylight-calendar-notes-v1',key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return{y,m:m-1,d}},$=s=>document.querySelector(s);let notes=JSON.parse(localStorage.getItem(storageKey)||'{}'),realToday=new Date(),initialYear=realToday.getFullYear()>=2026&&realToday.getFullYear()<=2027?realToday.getFullYear():2026,initialMonth=realToday.getFullYear()>=2026&&realToday.getFullYear()<=2027?realToday.getMonth():0,initialDay=realToday.getFullYear()>=2026&&realToday.getFullYear()<=2027?realToday.getDate():1,view={year:initialYear,month:initialMonth},selected=key(initialYear,initialMonth,initialDay),editing=null,selectedType='Homework',pickerYear=initialYear;const prettyDate=(k,year=true)=>{const{y,m,d}=parseKey(k);return new Date(y,m,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',...(year?{year:'numeric'}:{})})},save=()=>localStorage.setItem(storageKey,JSON.stringify(notes)),escapeHTML=t=>{const d=document.createElement('div');d.textContent=t;return d.innerHTML};function renderCalendar(){$('#month-title').innerHTML=`${monthNames[view.month]} <span>${view.year}</span>`;const g=$('#calendar-grid');g.innerHTML='';const lead=new Date(view.year,view.month,1).getDay(),count=new Date(view.year,view.month+1,0).getDate();for(let i=0;i<lead;i++)g.append(document.createElement('div'));for(let d=1;d<=count;d++){const k=key(view.year,view.month,d),b=document.createElement('button'),items=notes[k]||[];b.type='button';b.className='day-cell';if(k===selected)b.classList.add('selected');if(k===key(realToday.getFullYear(),realToday.getMonth(),realToday.getDate()))b.classList.add('today');b.innerHTML=`<span>${d}</span>${items.length?`<em class="indicator ${items.some(n=>n.type==='Exam')?'exam-indicator':''}"></em>`:''}`;b.onclick=()=>{selected=k;render()};g.append(b)}}function renderNotes(){const items=notes[selected]||[];$('#selected-label').textContent=items.length?`${items.length} ITEM${items.length===1?'':'S'} PLANNED`:'SELECTED DAY';$('#selected-title').textContent=prettyDate(selected,false);const l=$('#note-list');l.innerHTML='';if(!items.length){l.innerHTML='<div class="empty-state"><div class="empty-icon">✦</div><p>Nothing planned yet.</p><button type="button" id="empty-add">Add something</button></div>';$('#empty-add').onclick=openNew;return}items.forEach((item,i)=>{const c=document.createElement('button');c.className=`note-card ${item.type.toLowerCase()}`;c.type='button';c.innerHTML=`<span class="note-type"><i></i>${item.type}</span><span class="note-text">${escapeHTML(item.text)}</span><span class="chevron">›</span>`;c.onclick=()=>openEdit(i);l.append(c)})}function render(){renderCalendar();renderNotes()}function moveMonth(delta){const n=new Date(view.year,view.month+delta,1);if(n.getFullYear()<2026||n.getFullYear()>2027)return;view={year:n.getFullYear(),month:n.getMonth()};renderCalendar()}function openSheet(){$('#sheet-date').textContent=prettyDate(selected);$('#note-sheet').hidden=false;$('#sheet-backdrop').hidden=false;requestAnimationFrame(()=>{$('#note-sheet').classList.add('open');$('#sheet-backdrop').classList.add('open');$('#note-text').focus()})}function closeSheet(){$('#note-sheet').classList.remove('open');$('#sheet-backdrop').classList.remove('open');setTimeout(()=>{$('#note-sheet').hidden=true;$('#sheet-backdrop').hidden=true},180)}function setType(type){selectedType=type;document.querySelectorAll('.type-option').forEach(b=>b.classList.toggle('active',b.dataset.type===type))}function openNew(){editing=null;$('#sheet-title').textContent='New item';$('#note-text').value='';$('#delete-note').hidden=true;setType('Homework');openSheet()}function openEdit(i){editing=i;const a=notes[selected][i];$('#sheet-title').textContent='Edit item';$('#note-text').value=a.text;$('#delete-note').hidden=false;setType(a.type);openSheet()}function saveNote(){const text=$('#note-text').value.trim();if(!text)return $('#note-text').focus();const l=notes[selected]||[],item={text,type:selectedType};if(editing===null)l.push(item);else l[editing]=item;notes[selected]=l;save();closeSheet();render()}function deleteNote(){if(editing===null)return;notes[selected].splice(editing,1);if(!notes[selected].length)delete notes[selected];save();closeSheet();render()}function renderPicker(){document.querySelectorAll('.year-tabs button').forEach(b=>b.classList.toggle('active',+b.dataset.year===pickerYear));const t=$('#month-buttons');t.innerHTML='';shortMonths.forEach((name,m)=>{const b=document.createElement('button');b.type='button';b.textContent=name;b.classList.toggle('active',view.year===pickerYear&&view.month===m);b.onclick=()=>{view={year:pickerYear,month:m};$('#picker-popover').hidden=true;renderCalendar()};t.append(b)})}$('#previous-month').onclick=()=>moveMonth(-1);$('#next-month').onclick=()=>moveMonth(1);$('#today-button').onclick=()=>{const v=realToday.getFullYear()>=2026&&realToday.getFullYear()<=2027;view={year:v?realToday.getFullYear():2026,month:v?realToday.getMonth():0};selected=key(view.year,view.month,v?realToday.getDate():1);render()};$('#add-note').onclick=openNew;$('#cancel-note').onclick=closeSheet;$('#sheet-backdrop').onclick=closeSheet;$('#save-note').onclick=saveNote;$('#delete-note').onclick=deleteNote;document.querySelectorAll('.type-option').forEach(b=>b.onclick=()=>setType(b.dataset.type));$('#month-picker').onclick=()=>{pickerYear=view.year;renderPicker();$('#picker-popover').hidden=false};$('#close-picker').onclick=()=>$('#picker-popover').hidden=true;document.querySelectorAll('.year-tabs button').forEach(b=>b.onclick=()=>{pickerYear=+b.dataset.year;renderPicker()});render();

    <script>

      const dateFr=(k,annee=true)=>{const{y,m,d}=parseKey(k);return new Date(y,m,d).toLocaleDateString('fr-FR',{weekday:'long',month:'long',day:'numeric',...(annee?{year:'numeric'}:{})});};
      function renderCalendar(){$('#month-title').innerHTML=`${mois[view.month]} <span>${view.year}</span>`;const g=$('#calendar-grid');g.innerHTML='';const lead=(new Date(view.year,view.month,1).getDay()+6)%7,count=new Date(view.year,view.month+1,0).getDate();for(let i=0;i<lead;i++)g.append(document.createElement('div'));for(let d=1;d<=count;d++){const k=key(view.year,view.month,d),b=document.createElement('button'),items=notes[k]||[];b.type='button';b.className='day-cell';if(k===selected)b.classList.add('selected');if(k===key(realToday.getFullYear(),realToday.getMonth(),realToday.getDate()))b.classList.add('today');b.innerHTML=`<span>${d}</span>${items.length?`<em class="indicator ${items.some(n=>n.type==='Exam')?'exam-indicator':''}"></em>`:''}`;b.onclick=()=>{selected=k;render()};g.append(b)}}
      function renderNotes(){const items=notes[selected]||[];$('#selected-label').textContent=items.length?`${items.length} ÉLÉMENT${items.length===1?'':'S'} PRÉVU${items.length===1?'':'S'}`:'JOUR SÉLECTIONNÉ';$('#selected-title').textContent=dateFr(selected,false);const l=$('#note-list');l.innerHTML='';if(!items.length){l.innerHTML='<div class="empty-state"><div class="empty-icon">✦</div><p>Rien de prévu pour le moment.</p><button type="button" id="empty-add">Ajouter un élément</button></div>';$('#empty-add').onclick=openNew;return}items.forEach((item,i)=>{const c=document.createElement('button');c.className=`note-card ${item.type.toLowerCase()}`;c.type='button';c.innerHTML=`<span class="note-type"><i></i>${libelles[item.type]}</span><span class="note-text">${escapeHTML(item.text)}</span><span class="chevron">›</span>`;c.onclick=()=>openEdit(i);l.append(c)})}

      function openSheet(){$('#sheet-date').textContent=dateFr(selected);$('#note-sheet').hidden=false;$('#sheet-backdrop').hidden=false;requestAnimationFrame(()=>{$('#note-sheet').classList.add('open');$('#sheet-backdrop').classList.add('open');$('#note-text').focus()})}

    <script>
      const reminderStore='ecole-reminders';
      const readReminders=()=>JSON.parse(localStorage.getItem(reminderStore)||'[]');
      function showReminders(){const list=document.querySelector('#reminder-list'),items=readReminders();list.innerHTML=items.length?items.map((r,i)=>`<div class="note-card"><span class="note-text">${r.title}<br><small>${r.date} · ${r.time} · ${r.days} jour(s) avant</small></span><button class="text-button" data-remove="${i}">Supprimer</button></div>`).join(''):'<p style="color:#aeb6c4;font-size:13px">Aucun rappel enregistré.</p>';list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const a=readReminders();a.splice(+b.dataset.remove,1);localStorage.setItem(reminderStore,JSON.stringify(a));showReminders()})}
      document.querySelector('#reminder-button').addEventListener('click',showReminders);
      document.querySelector('#save-reminder').onclick=async()=>{const title=document.querySelector('#reminder-title').value.trim(),date=document.querySelector('#reminder-date').value,time=document.querySelector('#reminder-time').value,days=+document.querySelector('#reminder-days').value;if(!title||!date||!time)return;const r={title,date,time,days};const all=readReminders();all.push(r);localStorage.setItem(reminderStore,JSON.stringify(all));const plugin=window.Capacitor?.Plugins?.LocalNotifications;if(plugin){const at=new Date(`${date}T${time}:00`);at.setDate(at.getDate()-days);await plugin.requestPermissions();await plugin.schedule({notifications:[{id:Date.now()%2147483647,title:'ECOLE — rappel',body:`${title} dans ${days} jour(s)`,schedule:{at}}]});}showReminders();document.querySelector('#reminder-panel').hidden=true};
    </script>
  </body>
</html>
